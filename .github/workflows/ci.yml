name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Install task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install go-consistent
        run: go install github.com/quasilyte/go-consistent@latest
      - name: Consistency check
        run: task consistent

  test:
    name: Unit tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.18'
          - '1.19'
          - '1.20'
          - '1.21'
          - '1.22'
          - '1.23'
          - '1.24'
          - '1.25'
          - 'stable'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install gotestsum
        # Use a prebuilt binary rather than `go install`: building
        # gotestsum@latest needs a newer toolchain than the older matrix Go
        # versions (1.18-1.20 predate GOTOOLCHAIN auto-upgrade).
        run: |
          version=1.13.0
          curl -sSfL "https://github.com/gotestyourself/gotestsum/releases/download/v${version}/gotestsum_${version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gotestsum
      - name: Install task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: task test:coverage
      - name: Upload coverage reports to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v7
        with:
          slug: peczenyj/xpool
