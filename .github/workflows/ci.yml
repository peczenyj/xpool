name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    name: Unit tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.18'
          - '1.19'
          - '1.20'
          - '1.21'
          - '1.22'
          - '1.23'
          - '1.24'
          - '1.25'
          - 'stable'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install gotestsum
        # gotestsum@latest's go.mod may require a newer toolchain than the
        # matrix Go; allow this build step (only) to fetch one. The tests
        # below still run on the matrix Go version.
        env:
          GOTOOLCHAIN: auto
        run: go install gotest.tools/gotestsum@latest
      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: task test:coverage
      - name: Upload coverage reports to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: peczenyj/xpool
